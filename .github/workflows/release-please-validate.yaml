name: Validate Release Please Config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rp-validate:
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2025-12-17T23%3A01%3A41.484000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Release Please Config and Manifest are in sync with the repository
        run: node scripts/check-release-please.mjs
    timeout-minutes: 40
