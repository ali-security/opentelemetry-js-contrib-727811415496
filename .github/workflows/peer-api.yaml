name: Ensure API Peer Dependency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-api-check:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2025-12-17T23%3A01%3A41.484000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install script dependencies
        run: npm ci --ignore-scripts

      - name: Check API dependency semantics
        run: node ./scripts/peer-api-check.js
    timeout-minutes: 40
