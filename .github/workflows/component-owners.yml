name: Component Owners
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_self:
    permissions:
      pull-requests: write # required for assigning reviewers to PRs
    runs-on: ubuntu-latest
    name: Auto Assign Owners
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2025-12-17T23%3A01%3A41.484000Z@time-machines-npm.sealsecurity.io/
      - uses: dyladan/component-owners@main
        with:
          config-file: .github/component_owners.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 40
